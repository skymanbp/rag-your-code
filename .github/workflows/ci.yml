name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Windows is not optional here. The stream-encoding fix exists because a
    # non-UTF-8 console codepage killed the agent subprocess, and atomic index
    # publication behaves differently on Windows file locking.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with the dev extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run the suite
        run: python -m pytest -q
      - name: Byte-compile everything the docs tell you to
        run: python -m compileall -q src tests benchmarks

  benchmark:
    # Quality metrics are deterministic and are a user-facing contract; timings
    # are not asserted, only recorded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Golden retrieval set
        run: python -m benchmarks.run_benchmark --output benchmark-result.json
      - name: Assert the published quality numbers still hold
        run: |
          python - <<'PY'
          import json, sys
          report = json.load(open("benchmark-result.json"))
          hybrid = report["optimized"]["aggregate"]
          graph = report["graph"]
          failures = []
          for key in ("recall_at_k", "top1_accuracy", "mrr"):
              if hybrid[key] != 1.0:
                  failures.append(f"hybrid {key} = {hybrid[key]}, expected 1.0")
          if graph["graph_related_recall_at_3"] != 1.0:
              failures.append("graph expansion lost its related-callee recall")
          print(json.dumps({"hybrid": hybrid, "graph": graph}, indent=1))
          if failures:
              sys.exit("\n".join(failures))
          PY

  packaging:
    # The audit found SKILL.md telling an agent to run a module that nothing
    # installs, passing only because the dev machine had an editable install.
    # This job has no such install and no repo on sys.path, so it fails if the
    # published artifact cannot actually serve the documented workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: The wheel must carry the licence it declares
        run: |
          python - <<'PY'
          import pathlib, zipfile, sys
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          print("\n".join(sorted(names)))
          missing = [n for n in ("LICENSE", "py.typed") if not any(n in entry for entry in names)]
          if missing:
              sys.exit(f"wheel is missing: {missing}")
          PY
      - name: Install the wheel into a clean environment and run the documented workflow
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install dist/*.whl
          mkdir -p /tmp/probe
          printf 'def charge(amount):\n    return amount * 2\n' > /tmp/probe/billing.py
          cd /tmp/probe
          # Exactly the commands skills/rag-your-code/SKILL.md prescribes.
          /tmp/clean/bin/python -c "import ragyourcode"
          /tmp/clean/bin/python -m ragyourcode.cli index .
          /tmp/clean/bin/python -m ragyourcode.cli search "charge an amount" --json
          /tmp/clean/bin/python -m ragyourcode.cli annotate
          /tmp/clean/bin/python -m ragyourcode.cli config init
          /tmp/clean/bin/python -m ragyourcode.cli config set index.ignore '["vendor"]'
          /tmp/clean/bin/python -m ragyourcode.cli describe status
          /tmp/clean/bin/python -m ragyourcode.cli index .
          # The declared console script must work too.
          /tmp/clean/bin/rag-your-code search "charge an amount" --json
          printf '%s\n' '{"action":"stats"}' | /tmp/clean/bin/python -m ragyourcode.cli agent --root .

  install-instruction:
    # SKILL.md's step 0 is the one command an agent runs before it can run any
    # other, and it is the one command no other job exercised. 0.3.0 shipped it
    # pointing at a package index this project does not publish to, which no
    # gate noticed. This job runs the instruction as written.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Extract the install command from the skill and run it
        run: |
          python - <<'PY' > /tmp/install.sh
          import pathlib, re, sys
          text = pathlib.Path("skills/rag-your-code/SKILL.md").read_text(encoding="utf-8")
          found = re.findall(r"(python -m pip install [^\n]+)", text)
          if len(found) != 1:
              sys.exit(f"expected exactly one install command in SKILL.md, found {found}")
          print(found[0])
          PY
          cat /tmp/install.sh
          python -m venv /tmp/asdocumented
          /tmp/asdocumented/bin/python -m pip install --upgrade pip
          sed 's|^python |/tmp/asdocumented/bin/python |; s| --user||' /tmp/install.sh > /tmp/run.sh
          cat /tmp/run.sh
          sh /tmp/run.sh
          /tmp/asdocumented/bin/python -c "import ragyourcode; print(ragyourcode.__version__)"
