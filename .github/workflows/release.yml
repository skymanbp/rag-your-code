name: Release

# Publishing to PyPI is irreversible: a version cannot be replaced and a
# deleted name cannot be reused. So the trigger is a version tag, which is a
# deliberate act, and the artifact that gets published is the same one the
# checks ran against rather than a second build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: The tag must name the version the package declares
        # A tag and a pyproject that disagree would publish something nobody
        # asked for under a name nobody can trace back. Skipped for a manual
        # run, which has no tag to compare against.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          declared = re.search(r'^version = "([^"]+)"', text, re.M).group(1)
          print(f"tag={tag} pyproject={declared}")
          if tag != declared:
              sys.exit(f"tag v{tag} does not match pyproject version {declared}")
          PY

      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: The wheel must still carry what it declares
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          missing = [n for n in ("LICENSE", "py.typed") if not any(n in entry for entry in names)]
          if missing:
              sys.exit(f"wheel is missing: {missing}")
          print(wheel.name, "ok")
          PY

      - name: Install the built wheel and run the documented workflow
        # The last gate before an irreversible publish, and the one that has
        # caught real defects: it uses no repository checkout on sys.path.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          mkdir -p /tmp/probe && cd /tmp/probe
          printf 'def charge(amount):\n    return amount * 2\n' > billing.py
          /tmp/clean/bin/python -m ragyourcode.cli index .
          /tmp/clean/bin/rag-your-code search "charge an amount" --json
          /tmp/clean/bin/rag-your-code config list
          /tmp/clean/bin/rag-your-code describe status

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no
    # API token exists to leak or rotate. The claim is bound to
    # skymanbp/rag-your-code and this file's name, which is why renaming this
    # file breaks publishing until the claim on PyPI is updated to match.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
